<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A little universe, made for Lidya.">
  <title>For Lidya ♥</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="universe" aria-label="An animated glowing flower dedicated to Lidya">
    <canvas id="art" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <header class="signature">
      <span class="eyebrow">A universe, just for you</span>
      <h1>LIDYA<span class="heart"> ♥</span></h1>
      <p class="instruction">TOUCH THE FLOWER · LET IT BLOOM</p>
    </header>
    <div class="bottom-note" id="hint">A thousand little lights. One beautiful reason.</div>
    <div class="love-note" id="loveNote" role="status" aria-live="polite">
      <span class="note-rule"></span>
      <p>Forever &amp; Always, Lidya <span>♥</span></p>
      <small>In every universe, it's you.</small>
    </div>
    <button class="soundless-hint" id="reveal" type="button" aria-label="Reveal a romantic message">✦</button>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
